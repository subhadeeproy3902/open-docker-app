name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Python syntax
        run: python -m py_compile berth/*.py tests/*.py tools/*.py packaging/pyinstaller/launcher.py
      - name: Ruff (errors only)
        run: pip install ruff && ruff check --select E9,F63,F7,F82 berth tests tools
      - name: Shell scripts
        run: shellcheck -S warning scripts/install.sh tools/demo/up.sh tools/demo/down.sh tools/distro_test.sh tools/ci_app_tests.sh
      - name: Desktop + AppStream metadata
        run: |
          sudo apt-get install -y -qq desktop-file-utils appstream >/dev/null
          sed 's|@BINDIR@|/usr/bin|; s|@ICON@|io.github.subhadeeproy3902.Berth|' data/io.github.subhadeeproy3902.Berth.desktop.in > /tmp/berth.desktop
          desktop-file-validate /tmp/berth.desktop
          appstreamcli validate --no-net --pedantic data/io.github.subhadeeproy3902.Berth.metainfo.xml || appstreamcli validate --no-net data/io.github.subhadeeproy3902.Berth.metainfo.xml

  connect:
    name: Databases & sharing (real Docker)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: PyGObject (the volume helper code imports it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 >/dev/null
      - name: Integration test against the runner's Docker (public tunnel skipped)
        run: /usr/bin/python3 tests/connect.py --no-tunnel

  app-tests:
    name: App tests (every page, dialog and user path)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Demo engine (an isolated Docker inside Docker with sample stacks)
        run: sh tools/demo/up.sh
      - name: drive · clickall · ui audit · send files · ssh · self-test (Arch container, current GTK)
        run: sh tools/ci_app_tests.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: app-tests, path: ci-out }

  distros:
    name: Linux ${{ matrix.distro }} (installer + every screen)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, debian, ubuntu, opensuse, arch]
    steps:
      - uses: actions/checkout@v7
      - run: sh tools/demo/up.sh
      - name: Install with scripts/install.sh, then open every screen
        run: OUT="$PWD/distro-out" sh tools/distro_test.sh ${{ matrix.distro }}
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: "distro-${{ matrix.distro }}", path: distro-out }

  windows-pipe:
    name: Windows named pipe (the runner's Docker)
    needs: check
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Docker service on the runner
        shell: pwsh
        run: |
          $s = Get-Service docker
          if ($s.Status -ne 'Running') { Start-Service docker }
          Get-Service docker
      - name: Berth talks to Docker through \\.\pipe\docker_engine (ping, lists, streams, a container's logs)
        run: python tools/pipe_check.py

  linux-tarball:
    name: Linux tarball
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make dist
      - uses: actions/upload-artifact@v7
        with: { name: berth-linux, path: dist/berth-linux.tar.gz }

  flatpak:
    name: Flatpak (any Linux)
    needs: check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: berth.flatpak
          manifest-path: packaging/flatpak/io.github.subhadeeproy3902.Berth.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  macos:
    name: macOS app (Apple Silicon)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4 + libadwaita + PyGObject (Homebrew)
        run: brew install gtk4 libadwaita pygobject3 adwaita-icon-theme librsvg
      - name: PyInstaller
        run: |
          PY="$(brew --prefix)/bin/python3"
          "$PY" -m venv --system-site-packages .venv
          .venv/bin/pip install -q pyinstaller pyinstaller-hooks-contrib
      - name: App icon (.icns, from the Apple-grid version of the logo)
        run: |
          mkdir -p berth.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s data/icons/berth-macos-1024.png --out berth.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) data/icons/berth-macos-1024.png --out berth.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns berth.iconset -o data/icons/berth.icns
      - name: Build Berth.app
        run: .venv/bin/pyinstaller --noconfirm packaging/pyinstaller/berth.spec
      - name: Ad-hoc sign (no Apple account needed; avoids the "is damaged" error on Apple Silicon)
        run: |
          codesign --force --deep --sign - dist/Berth.app
          codesign --verify --deep --strict --verbose=2 dist/Berth.app
      - name: Smoke test
        run: ./dist/Berth.app/Contents/MacOS/Berth --version
      - name: Self-test (every page and the main dialogs, no engine)
        timeout-minutes: 4
        run: ./dist/Berth.app/Contents/MacOS/Berth --self-test
      - name: Launch test (the app renders its own window to a PNG, then quits)
        timeout-minutes: 3
        run: |
          BERTH_SHOT_DELAY=6 ./dist/Berth.app/Contents/MacOS/Berth --screenshot "$PWD/launch-macos.png"
          test -s launch-macos.png
      - uses: actions/upload-artifact@v7
        with: { name: launch-screenshot-macos, path: launch-macos.png }
      - name: Disk image
        run: hdiutil create -volname Berth -srcfolder dist/Berth.app -ov -format UDZO dist/Berth-macos-arm64.dmg
      - uses: actions/upload-artifact@v7
        with: { name: berth-macos, path: dist/Berth-macos-arm64.dmg }

  windows:
    name: Windows app (x64)
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-pyinstaller
            zip
      - name: Build Berth.exe
        run: python -m PyInstaller --noconfirm packaging/pyinstaller/berth.spec
      - name: Smoke test
        run: ./dist/Berth/Berth.exe --version
      - name: Self-test (every page and the main dialogs, no engine)
        timeout-minutes: 4
        run: ./dist/Berth/Berth.exe --self-test
      - name: Launch test (the app renders its own window to a PNG, then quits)
        timeout-minutes: 3
        run: |
          BERTH_SHOT_DELAY=6 ./dist/Berth/Berth.exe --screenshot "$(cygpath -w "$PWD")\\launch-windows.png"
          test -s launch-windows.png
      - uses: actions/upload-artifact@v7
        with: { name: launch-screenshot-windows, path: launch-windows.png }
      - name: Zip
        run: cd dist && zip -qr Berth-windows-x64.zip Berth
      - uses: actions/upload-artifact@v7
        with: { name: berth-windows, path: dist/Berth-windows-x64.zip }

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-tarball, flatpak, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - name: Collect files + checksums
        run: |
          mkdir out
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.flatpak' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} out/ \;
          cp scripts/install.sh out/install.sh
          cp data/icons/berth-1024.png out/berth-logo.png
          cd out && sha256sum * > SHA256SUMS.txt && ls -la
      - name: Release notes from CHANGELOG
        run: |
          {
            echo '<p align="center"><img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/data/icons/berth-512.png" width="128" alt="Berth"></p>'
            echo
            V="${GITHUB_REF_NAME#v}"      # the section for this tag (not "Unreleased")
            awk -v v="$V" '/^## \[/{p = (index($0, "[" v "]") > 0)} p' CHANGELOG.md | tail -n +2
          } > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          body_path: notes.md
          name: Berth ${{ github.ref_name }}
