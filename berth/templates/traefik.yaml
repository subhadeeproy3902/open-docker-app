# title: Traefik + whoami
# description: The Traefik reverse proxy with its dashboard, routing whoami.localhost to a demo service.
# open: http://localhost:8093
services:
  traefik:
    image: traefik:v3
    command: ["--api.insecure=true", "--providers.docker=true", "--providers.docker.exposedbydefault=false",
              "--entrypoints.web.address=:80"]
    ports: ["127.0.0.1:8094:80", "127.0.0.1:8093:8080"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped
  whoami:
    image: traefik/whoami:latest
    labels:
      traefik.enable: "true"
      traefik.http.routers.whoami.rule: Host(`whoami.localhost`)
      traefik.http.routers.whoami.entrypoints: web
    restart: unless-stopped
